services:
  mysql:
    image: mysql:8.4
    command: ['--default-time-zone=+00:00']
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: openrack
      MYSQL_USER: openrack
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openrack}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-development-only}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      retries: 20
volumes:
  mysql_data:
